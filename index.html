:root{--green:#166534;--pale:#f0fdf4;--ink:#17211b;--muted:#64748b;--wa:#25D366}
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#f3f7f4;color:var(--ink);line-height:1.6;padding-bottom:50px}

/* الهيدر وشريط البث */
header{background:linear-gradient(135deg,#14532d,#15803d);color:#fff;padding:15px;text-align:center;box-shadow:0 2px 5px rgba(0,0,0,0.1)}

header p{margin:4px 0 0;font-size:12px;opacity:.9}

.marquee-container{background:#1e293b;color:#fbbf24;padding:6px 10px;font-size:12px;font-weight:bold;overflow:hidden;white-space:nowrap;border-bottom:2px solid #14532d;min-height:30px}

.nav-bar{
  background: #ffffff;
  display: flex;
  gap: 5px;
  overflow-x: auto;
  padding: 10px;
  box-shadow: 0 3px 8px rgba(0,0,0,0.15);
  border-bottom: 2px solid #cbd5cf;
  position: sticky;
  top: 0;
  z-index: 9999;
}
.nav-bar a{
  white-space: nowrap;
  border: 1px solid #166534;
  background: #f0fdf4;
  color: var(--green);
  padding: 8px 14px;
  border-radius: 8px;
  font-weight: bold;
  text-decoration: none;
  font-size: 13px;
  flex-shrink: 0;
}
.nav-bar a.active{ background: var(--green); color: #fff; }
